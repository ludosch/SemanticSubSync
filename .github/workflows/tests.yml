name: tests

# Runs on every push to main and every pull request (a release tag is built by release.yml from
# a commit already tested). tools/release.py requires a green run on the released commit, so even
# a documentation-only commit gets a run: the first job lists the changed files and the others
# only start when their files changed (a skipped job counts as passed). The repository is public,
# so CI minutes are free, but the jobs stay lean: one end-to-end job per architecture, the
# Docker image and the Jellyfin plugin only when their own files change.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.x"   # the uv of mise.toml

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.paths.outputs.python }}
      release-files: ${{ steps.paths.outputs.release-files }}
      image: ${{ steps.paths.outputs.image }}
      plugin: ${{ steps.paths.outputs.plugin }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A manual run, a new branch or a rewritten history (no usable base): everything runs.
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
          else
            files=ALL
          fi
          printf '%s\n' "$files"
          ci='^\.github/workflows/tests\.yml$|'      # a change of this file runs every job
          has() { [ "$files" = ALL ] || grep -qE "$1" <<<"$files"; }
          other() { [ "$files" = ALL ] || grep -qvE "$1" <<<"$files"; }
          flag() { if "$@"; then echo true; else echo false; fi; }
          {
            # anything but documentation and the C# plugin
            echo "python=$(flag other '\.md$|\.svg$|^docs/|^LICENSE$|^\.gitignore$|^integrations/jellyfin/')"
            # the files tests/test_release.py reads
            echo "release-files=$(flag has "${ci}^README(\.fr)?\.md$|^CHANGELOG\.md$|^integrations/jellyfin/")"
            echo "image=$(flag has "${ci}^Dockerfile$|^requirements\.txt$|^pyproject\.toml$|^src/|^tools/smoke_image\.py$")"
            echo "plugin=$(flag has "${ci}^integrations/jellyfin/")"
          } | tee -a "$GITHUB_OUTPUT"

  # Unit tests, then end to end with the real models, on x86-64 and on ARM64 (Raspberry Pi class
  # hardware). The goal is "runs without crashing" on both architectures, not speed. Each
  # architecture runs one of the two supported Python versions: 3.11 is the oldest one and the
  # Docker image's, 3.12 a newer one.
  end-to-end:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            python: "3.11"
          - runner: ubuntu-24.04-arm
            python: "3.12"
    runs-on: ${{ matrix.runner }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uname -m && uv run --locked python --version

      - name: Unit tests
        run: uv run --locked pytest -q

      - name: Real models as downloaded (static, FP16 minilm)
        env:
          SEMSYNC_TEST_MODEL: "1"
        run: uv run --locked --extra model pytest -m model -q

      - name: Build the int8 minilm, then run the minilm tests with it
        env:
          SEMSYNC_TEST_MODEL: "1"
          SEMSYNC_MODEL_DIR: ${{ runner.temp }}/models
        run: |
          uv run --locked --extra model --with onnx==1.23.1 python tools/quantize_model.py "$SEMSYNC_MODEL_DIR/minilm"
          uv run --locked --extra model pytest -m model -q -k minilm

      - name: Command line on the lighthouse example, with each model (its README says 100 % and unsure)
        working-directory: examples/lighthouse
        env:
          INT8_DIR: ${{ runner.temp }}/models
        run: |
          for variant in static minilm minilm-int8; do
            model=${variant%-int8}
            if [ "$variant" = minilm-int8 ]; then export SEMSYNC_MODEL_DIR="$INT8_DIR"; else unset SEMSYNC_MODEL_DIR; fi
            out="$RUNNER_TEMP/$variant"
            run_sss() { uv run --locked --extra model semantic-subsync --model "$model" "$@"; }
            run_sss 1-missing-scene/downloaded.fr.srt 1-missing-scene/reference.en.srt -o "$out-1.srt"
            run_sss 2-extra-scene/downloaded.fr.srt 2-extra-scene/reference.en.srt -o "$out-2.srt"
            status=0
            run_sss 3-wrong-reference/downloaded.fr.srt 3-wrong-reference/reference.commentary.srt -o "$out-3.srt" || status=$?
            test "$status" -eq 1                    # the wrong reference: unsure, nothing written
            test ! -e "$out-3.srt"
            uv run --locked python - "$variant" "$out" <<'EOF'
          import sys
          from compare import accuracy
          variant, out = sys.argv[1:]
          for n, case in ((1, "1-missing-scene"), (2, "2-extra-scene")):
              share, worst = accuracy(f"{out}-{n}.srt", f"{case}/truth.fr.srt")
              print(f"{variant} {case}: {100 * share:.1f} % of lines within 300 ms, worst {worst:.2f} s")
              assert share == 1.0, (variant, case)
          EOF
          done

  # The unit tests (no model) on the other systems the README names.
  unit-tests:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv run --locked pytest -q

  # A change to the READMEs, the changelog or the plugin only: the release script's checks of
  # those files (the full unit suite above covers them otherwise).
  release-files:
    needs: changes
    if: needs.changes.outputs.release-files == 'true' && needs.changes.outputs.python != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv run --locked pytest -q tests/test_release.py

  # The image as release.yml builds it (amd64 only here; the release builds both).
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t semantic-subsync:ci .
      - run: docker run --rm semantic-subsync:ci semantic-subsync --version
      - name: The image reads an embedded subtitle (ffmpeg, ffprobe, disposition flags)
        run: docker run --rm -v "$PWD/tools:/tools:ro" semantic-subsync:ci python /tools/smoke_image.py

  # The Jellyfin plugin compiles, with the same command as release.yml.
  plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the plugin (.NET SDK container, as for a local build)
        run: |
          docker run --rm -v "$PWD/integrations/jellyfin:/src" -w /src mcr.microsoft.com/dotnet/sdk:10.0 \
            dotnet publish Jellyfin.Plugin.SemanticSubSync -c Release -o /src/artifacts
