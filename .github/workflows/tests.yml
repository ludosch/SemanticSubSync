name: tests

on:
  # Branch pushes only (a release tag is built by release.yml from a commit already tested),
  # and not for documentation-only changes: CI minutes are limited on a private repository.
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

jobs:
  # Unit tests, then end to end with the real model, on x86-64 and on ARM64 (Raspberry Pi class
  # hardware). The goal is "runs without crashing" on both architectures, not speed. Each
  # architecture runs one of the two supported Python versions: 3.11 is the oldest one and the
  # Docker image's, 3.12 a newer one. Each job is billed by the started minute, hence one job
  # per architecture and no Docker build here (release.yml builds and checks the images).
  end-to-end:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            python: "3.11"
          - runner: ubuntu-24.04-arm
            python: "3.12"
    runs-on: ${{ matrix.runner }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uname -m && uv run python --version

      - name: Unit tests
        run: uv run pytest -q

      - name: Real model (FP16, downloaded on first use)
        env:
          SEMSYNC_TEST_MODEL: "1"
        run: uv run --extra model pytest -m model -q

      - name: Build the int8 model, then run the same tests with it
        env:
          SEMSYNC_TEST_MODEL: "1"
          SEMSYNC_MODEL_DIR: ${{ runner.temp }}/minilm-int8
        run: |
          uv run --extra model --with onnx python tools/quantize_model.py "$SEMSYNC_MODEL_DIR"
          uv run --extra model pytest -m model -q

      - name: Command line on the lighthouse example
        env:
          SEMSYNC_MODEL_DIR: ${{ runner.temp }}/minilm-int8
        run: |
          cd examples/lighthouse
          uv run --extra model semantic-subsync 1-missing-scene/downloaded.fr.srt 1-missing-scene/reference.en.srt -o "$RUNNER_TEMP/out1.srt"
          uv run --extra model semantic-subsync 2-extra-scene/downloaded.fr.srt 2-extra-scene/reference.en.srt -o "$RUNNER_TEMP/out2.srt"
          set +e
          uv run --extra model semantic-subsync 3-wrong-reference/downloaded.fr.srt 3-wrong-reference/reference.commentary.srt -o "$RUNNER_TEMP/out3.srt"
          status=$?
          set -e
          test "$status" -eq 1                      # the wrong reference must be refused
          test ! -e "$RUNNER_TEMP/out3.srt"
          uv run python - <<'EOF'
          import os
          from semantic_subsync import media
          tmp = os.environ["RUNNER_TEMP"]
          for case, out in (("1-missing-scene", "out1.srt"), ("2-extra-scene", "out2.srt")):
              truth = {}
              for s, _, x in media.read_srt(f"{case}/truth.fr.srt"):
                  truth.setdefault(x, []).append(s)
              err = [abs(s - truth[x].pop(0)) for s, _, x in media.read_srt(f"{tmp}/{out}") if truth.get(x)]
              share = sum(e <= 0.3 for e in err) / len(err)
              print(f"{case}: {100 * share:.1f} % of lines within 300 ms")
              assert share >= 0.95, case
          EOF
