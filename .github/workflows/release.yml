name: release

# A tag vX.Y.Z builds the Python package, the dependency constraints, the Docker image (amd64 and
# arm64) and the Jellyfin plugin, and attaches them to a GitHub release with the plugin repository
# manifest. Started by hand, it only builds them as workflow artifacts.
# The manifest is served as releases/latest/download/manifest.json, the URL Jellyfin is given:
# the release is only published (and becomes the latest) once every file is attached.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.x"   # the uv of mise.toml

jobs:
  package:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - id: version
        run: |
          version=$(uv run --locked python -c "import semantic_subsync; print(semantic_subsync.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package version ($version)"
            exit 1
          fi
      - name: The changelog has notes for this version (checked before the image builds)
        if: github.ref_type == 'tag'
        run: uv run --locked python tools/release.py --notes "${GITHUB_REF_NAME#v}"
      - run: uv build
      - name: Constraints (every dependency of semantic-subsync[static], pinned from uv.lock; the Jellyfin plugin installs with them)
        env:
          FILE: dist/semantic-subsync-${{ steps.version.outputs.version }}-constraints.txt
        run: |
          uv export --locked --no-dev --extra static --no-emit-project --no-hashes --format requirements-txt -o "$FILE"
          uv venv -q "$RUNNER_TEMP/check"
          uv pip install -q --python "$RUNNER_TEMP/check" -c "$FILE" "$(ls dist/*.whl)[static]"
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*

  docker:
    needs: package
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: semantic-subsync:${{ needs.package.outputs.version }}
      FILE: semantic-subsync-${{ needs.package.outputs.version }}-docker-${{ matrix.arch }}.tar.gz
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t "$IMAGE" .
      - run: docker run --rm "$IMAGE" semantic-subsync --version
      - name: The image reads an embedded subtitle (ffmpeg, ffprobe, disposition flags)
        run: docker run --rm -v "$PWD/tools:/tools:ro" "$IMAGE" python /tools/smoke_image.py
      - run: docker save "$IMAGE" | gzip > "$FILE"
      - uses: actions/upload-artifact@v7
        with:
          name: docker-${{ matrix.arch }}
          path: ${{ env.FILE }}
          compression-level: 0

  jellyfin:
    needs: package
    runs-on: ubuntu-24.04
    env:
      FILE: jellyfin-plugin-semanticsubsync-${{ needs.package.outputs.version }}.zip
    steps:
      - uses: actions/checkout@v7
      - name: Build the plugin (.NET SDK container, as for a local build)
        run: |
          docker run --rm -v "$PWD/integrations/jellyfin:/src" -w /src mcr.microsoft.com/dotnet/sdk:10.0 \
            dotnet publish Jellyfin.Plugin.SemanticSubSync -c Release -o /src/artifacts
          zip -j "$FILE" integrations/jellyfin/artifacts/Jellyfin.Plugin.SemanticSubSync.dll
      - uses: actions/upload-artifact@v7
        with:
          name: jellyfin-plugin
          path: ${{ env.FILE }}

  release:
    if: github.ref_type == 'tag'
    needs: [package, docker, jellyfin]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Release notes from the changelog
        run: |
          python3 tools/release.py --notes "${GITHUB_REF_NAME#v}" > notes.md
          cat notes.md
      - name: Jellyfin plugin repository manifest (Jellyfin reads the latest release's copy)
        run: |
          v="${GITHUB_REF_NAME#v}"
          python3 tools/jellyfin_manifest.py "$v" "assets/jellyfin-plugin-semanticsubsync-$v.zip" notes.md > assets/manifest.json
      - name: Draft release, every file attached, then published as the latest
        # Re-runnable after a partial failure: the draft is reused and the files replaced.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" assets/* --clobber
          missing=$(comm -23 <(ls assets | sort) <(gh release view "$TAG" --json assets -q '.assets[].name' | sort))
          if [ -n "$missing" ]; then
            echo "Not attached: $missing"
            exit 1
          fi
          gh release edit "$TAG" --draft=false --latest
