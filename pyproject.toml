[project]
name = "semantic-subsync"
dynamic = ["version"]
description = "Re-time a subtitle on a reference subtitle in another language by matching cues on meaning."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ludosch" }]
keywords = ["subtitles", "srt", "synchronization", "sentence-embeddings", "bazarr", "jellyfin"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.11"
dependencies = ["numpy>=2", "charset-normalizer>=3"]

[project.urls]
Repository = "https://github.com/ludosch/SemanticSubSync"
Changelog = "https://github.com/ludosch/SemanticSubSync/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The sentence models. Not needed by the unit tests, which use a deterministic fake embedder.
model = ["fastembed>=0.8", "tokenizers>=0.20", "huggingface-hub>=0.24"]

[project.scripts]
semantic-subsync = "semantic_subsync.cli:main"
semantic-subsync-worker = "semantic_subsync.worker:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.version]
path = "src/semantic_subsync/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: needs the real sentence models (set SEMSYNC_TEST_MODEL=1, optionally SEMSYNC_MODEL_DIR)",
    "corpus: real downloaded subtitles, kept out of the repository (set SEMSYNC_CORPUS)",
]
